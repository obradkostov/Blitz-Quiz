<!DOCTYPE html>
<html lang="sr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blitz Quiz</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="app">
        <h1>Blitz Quiz</h1>

        <!-- Početni ekran: nova partija + Top 10 -->
        <section id="start" class="start-grid">
            <div class="card">
                <h2>Nova partija</h2>
                <p class="muted">10 pitanja, tri težine. Brži odgovor nosi više poena.</p>
                <p id="final" class="final"></p>
                <input id="playerName" placeholder="Tvoje ime" maxlength="20" autocomplete="off">
                <p id="nameError" class="error"></p>
                <button id="startBtn" class="primary">Počni partiju</button>
            </div>

            <div class="card">
                <h2>Top 10</h2>
                <table id="board"></table>
            </div>
            <div class="card wide">
                <h2>Uživo</h2>
                <ul id="feed"></ul>
            </div>
        </section>

        <!-- Ekran partije -->
        <section id="game" class="card hidden">
            <div class="top">
                <div id="meta"></div>
                <div id="timer"></div>
            </div>
            <div class="bar">
                <div id="barFill"></div>
            </div>
            <h2 id="qtext"></h2>
            <div id="options"></div>
            <p id="result"></p>
            <button id="nextBtn" class="primary hidden">Sledeće pitanje</button>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
